<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N3 최다 빈출 문형</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap');

  :root {
    --bg: #F5F3FF;
    --surface: #FFFFFF;
    --surface2: #EDE9FD;
    --purple: #4B3F8D;
    --purple-light: #7B6FBD;
    --purple-dark: #2D2540;
    --accent: #FFD166;
    --accent2: #06D6A0;
    --red: #EF476F;
    --text: #1A1530;
    --text-muted: #6B6580;
    --border: #D4CEEE;
    --shadow: 0 2px 12px rgba(75,63,141,0.10);
    --shadow-lg: 0 8px 32px rgba(75,63,141,0.18);
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ===== HEADER ===== */
  header {
    background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 60%, var(--purple-light) 100%);
    padding: 20px 24px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(45,37,64,0.25);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 900px;
    margin: 0 auto;
  }

  .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: white;
    letter-spacing: -0.02em;
  }
  .logo span {
    background: var(--accent);
    color: var(--purple-dark);
    padding: 2px 8px;
    border-radius: 6px;
    margin-right: 6px;
    font-size: 0.85rem;
  }

  .progress-info {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.75);
    text-align: right;
  }
  .progress-info strong {
    color: var(--accent);
    font-size: 1rem;
  }

  .progress-bar-wrap {
    max-width: 900px;
    margin: 10px auto 0;
    background: rgba(255,255,255,0.2);
    border-radius: 99px;
    height: 5px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* ===== TABS ===== */
  .tabs-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px 16px 0;
  }

  .tabs {
    display: flex;
    gap: 8px;
    background: var(--surface);
    border-radius: 12px;
    padding: 5px;
    box-shadow: var(--shadow);
  }

  .tab-btn {
    flex: 1;
    padding: 10px 8px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .tab-btn.active {
    background: var(--purple);
    color: white;
    box-shadow: 0 2px 8px rgba(75,63,141,0.30);
  }
  .tab-btn:not(.active):hover { background: var(--surface2); color: var(--purple); }

  .tab-icon { font-size: 1rem; }

  /* ===== MAIN ===== */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px;
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ===== LIST VIEW ===== */
  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .search-input {
    flex: 1;
    padding: 10px 16px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.9rem;
    background: var(--surface);
    color: var(--text);
    transition: border 0.2s;
    outline: none;
  }
  .search-input:focus { border-color: var(--purple-light); }

  .reset-btn {
    padding: 10px 16px;
    background: var(--surface2);
    border: none;
    border-radius: var(--radius-sm);
    color: var(--purple);
    font-weight: 600;
    font-size: 0.82rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .reset-btn:hover { background: var(--border); }

  .grammar-list { display: flex; flex-direction: column; gap: 10px; }

  .grammar-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--border);
    transition: border-color 0.2s, transform 0.15s;
    cursor: pointer;
  }
  .grammar-card:hover { transform: translateX(3px); border-left-color: var(--purple-light); }
  .grammar-card.mastered { border-left-color: var(--accent2); background: #F0FDF9; }

  .card-left {}

  .pattern {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--purple);
    font-family: 'Noto Sans JP', sans-serif;
    margin-bottom: 2px;
  }
  .meaning {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .example-jp {
    font-size: 0.9rem;
    font-family: 'Noto Sans JP', sans-serif;
    color: var(--text);
    line-height: 1.6;
  }
  .example-kr {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 3px;
    line-height: 1.5;
  }

  .card-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    min-width: 44px;
  }

  .check-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .check-btn.done { background: var(--accent2); border-color: var(--accent2); color: white; }
  .check-btn:not(.done):hover { border-color: var(--accent2); color: var(--accent2); }

  /* ===== FLASHCARD VIEW ===== */
  .fc-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .fc-counter {
    font-weight: 700;
    color: var(--purple);
    font-size: 0.95rem;
  }

  .fc-mode-btn {
    padding: 6px 14px;
    border: 2px solid var(--purple);
    border-radius: 20px;
    background: transparent;
    color: var(--purple);
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .fc-mode-btn.active { background: var(--purple); color: white; }

  .flashcard-scene {
    perspective: 1000px;
    height: 320px;
    margin-bottom: 20px;
    cursor: pointer;
  }

  @media (max-width: 500px) {
    .flashcard-scene { height: 280px; }
  }

  .flashcard {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4,0,0.2,1);
  }
  .flashcard.flipped { transform: rotateY(180deg); }

  .fc-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    text-align: center;
    box-shadow: var(--shadow-lg);
  }

  .fc-front {
    background: linear-gradient(145deg, var(--purple) 0%, var(--purple-dark) 100%);
    color: white;
  }

  .fc-back {
    background: var(--surface);
    transform: rotateY(180deg);
    color: var(--text);
  }

  .fc-hint { font-size: 0.75rem; opacity: 0.6; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.1em; }

  .fc-pattern {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 10px;
    line-height: 1.3;
  }
  .fc-meaning-hint {
    font-size: 0.85rem;
    opacity: 0.7;
    background: rgba(255,255,255,0.15);
    padding: 4px 12px;
    border-radius: 20px;
  }

  .fc-meaning {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--purple);
    margin-bottom: 12px;
  }

  .fc-example-jp {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.95rem;
    color: var(--text);
    line-height: 1.7;
    margin-bottom: 8px;
    background: var(--surface2);
    padding: 10px 14px;
    border-radius: 10px;
    width: 100%;
  }

  .fc-example-kr {
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .fc-nav {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  .nav-btn {
    padding: 12px 24px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .nav-btn.prev { background: var(--surface2); color: var(--purple); }
  .nav-btn.next { background: var(--purple); color: white; }
  .nav-btn:hover { filter: brightness(0.93); }

  .fc-result-btns {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .result-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .result-btn.good { background: var(--accent2); color: white; }
  .result-btn.bad { background: var(--red); color: white; }
  .result-btn:hover { filter: brightness(0.9); }

  /* ===== QUIZ VIEW ===== */
  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .quiz-score { font-weight: 700; color: var(--purple); }
  .quiz-start-btn, .quiz-next-btn {
    padding: 10px 22px;
    background: var(--purple);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .quiz-start-btn:hover, .quiz-next-btn:hover { background: var(--purple-dark); }

  .quiz-question-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-lg);
    margin-bottom: 16px;
  }

  .quiz-type-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--purple-light);
    font-weight: 700;
    margin-bottom: 10px;
  }

  .quiz-question {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 1.05rem;
    line-height: 1.8;
    color: var(--text);
    margin-bottom: 6px;
  }
  .quiz-question .blank {
    display: inline-block;
    min-width: 80px;
    border-bottom: 3px solid var(--purple);
    color: var(--purple);
    font-weight: 700;
    text-align: center;
    margin: 0 4px;
  }

  .quiz-kr {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 18px;
  }

  .quiz-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  @media (max-width: 400px) {
    .quiz-options { grid-template-columns: 1fr; }
  }

  .quiz-option {
    padding: 12px 14px;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'Noto Sans JP', 'Noto Sans KR', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    font-weight: 500;
  }
  .quiz-option:hover:not(:disabled) { border-color: var(--purple-light); background: var(--surface2); }
  .quiz-option.correct { background: #D1FAE5; border-color: var(--accent2); color: #065F46; }
  .quiz-option.wrong { background: #FEE2E2; border-color: var(--red); color: #991B1B; }
  .quiz-option:disabled { cursor: default; }

  .quiz-feedback {
    padding: 14px 18px;
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    line-height: 1.6;
    margin-top: 8px;
    display: none;
  }
  .quiz-feedback.correct-fb { background: #D1FAE5; color: #065F46; border-left: 4px solid var(--accent2); }
  .quiz-feedback.wrong-fb { background: #FEE2E2; color: #991B1B; border-left: 4px solid var(--red); }

  .quiz-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }
  .quiz-empty .big { font-size: 2.5rem; margin-bottom: 10px; }

  /* ===== STATS VIEW ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  @media (max-width: 400px) {
    .stats-grid { grid-template-columns: 1fr; }
  }

  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px 14px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--purple);
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-label { font-size: 0.78rem; color: var(--text-muted); }

  .mastered-list-title {
    font-weight: 700;
    color: var(--purple-dark);
    margin-bottom: 10px;
    font-size: 0.95rem;
  }

  .tag-cloud {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.82rem;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 600;
  }
  .tag.mastered-tag { background: var(--surface2); color: var(--purple); }
  .tag.not-yet-tag { background: #FEE2E2; color: #991B1B; }

  .reset-all-btn {
    margin-top: 20px;
    padding: 12px;
    width: 100%;
    background: transparent;
    border: 2px solid var(--red);
    color: var(--red);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .reset-all-btn:hover { background: var(--red); color: white; }

  /* ===== QUIZ RESULT ===== */
  .quiz-result {
    text-align: center;
    padding: 30px 20px;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
  }
  .result-emoji { font-size: 3rem; margin-bottom: 12px; }
  .result-title { font-size: 1.4rem; font-weight: 700; color: var(--purple-dark); margin-bottom: 8px; }
  .result-score { font-family: 'Space Grotesk', sans-serif; font-size: 3rem; font-weight: 700; color: var(--purple); }
  .result-detail { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; margin-bottom: 20px; }

  /* responsive tweaks */
  @media (max-width: 600px) {
    .fc-pattern { font-size: 1.5rem; }
    .pattern { font-size: 0.98rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo"><span>N3</span>최다 빈출 문형</div>
    <div class="progress-info">
      완료 <strong id="masteredCount">0</strong> / <span id="totalCount">0</span>
    </div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
</header>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab-btn active" data-view="list"><span class="tab-icon">📋</span> 목록</button>
    <button class="tab-btn" data-view="flashcard"><span class="tab-icon">🃏</span> 플래시카드</button>
    <button class="tab-btn" data-view="quiz"><span class="tab-icon">✏️</span> 퀴즈</button>
    <button class="tab-btn" data-view="stats"><span class="tab-icon">📊</span> 통계</button>
  </div>
</div>

<main>

  <!-- LIST VIEW -->
  <div class="view active" id="view-list">
    <div class="search-row">
      <input class="search-input" type="text" id="searchInput" placeholder="문형 또는 뜻 검색...">
      <button class="reset-btn" onclick="clearSearch()">초기화</button>
    </div>
    <div class="grammar-list" id="grammarList"></div>
  </div>

  <!-- FLASHCARD VIEW -->
  <div class="view" id="view-flashcard">
    <div class="fc-controls">
      <div class="fc-counter">
        <span id="fcCurrent">1</span> / <span id="fcTotal">0</span>
      </div>
      <div style="display:flex; gap:6px">
        <button class="fc-mode-btn active" id="fcModeJP" onclick="setFCMode('jp')">日→한</button>
        <button class="fc-mode-btn" id="fcModeKR" onclick="setFCMode('kr')">한→日</button>
      </div>
    </div>

    <div class="flashcard-scene" onclick="flipCard()">
      <div class="flashcard" id="flashcard">
        <div class="fc-face fc-front" id="fcFront">
          <div class="fc-hint">탭해서 뒤집기</div>
          <div class="fc-pattern" id="fcFrontPattern"></div>
          <div class="fc-meaning-hint" id="fcFrontHint"></div>
        </div>
        <div class="fc-face fc-back" id="fcBack">
          <div class="fc-meaning" id="fcBackMeaning"></div>
          <div class="fc-example-jp" id="fcBackExJP"></div>
          <div class="fc-example-kr" id="fcBackExKR"></div>
        </div>
      </div>
    </div>

    <div id="fcResultBtns" class="fc-result-btns" style="display:none;">
      <button class="result-btn bad" onclick="fcAnswer(false)">❌ 다시</button>
      <button class="result-btn good" onclick="fcAnswer(true)">✅ 알았어!</button>
    </div>

    <div class="fc-nav">
      <button class="nav-btn prev" onclick="fcPrev()">◀ 이전</button>
      <button class="nav-btn next" onclick="fcNext()">다음 ▶</button>
    </div>
  </div>

  <!-- QUIZ VIEW -->
  <div class="view" id="view-quiz">
    <div class="quiz-header">
      <div class="quiz-score">정답률: <span id="quizScoreText">-</span></div>
      <button class="quiz-start-btn" onclick="startQuiz()">새 퀴즈 시작</button>
    </div>
    <div id="quizArea">
      <div class="quiz-empty">
        <div class="big">✏️</div>
        <div>퀴즈를 시작해 보세요!</div>
        <div style="font-size:0.8rem;margin-top:8px;color:var(--text-muted)">문형 보기, 뜻 맞추기 등 다양한 문제가 출제됩니다</div>
      </div>
    </div>
  </div>

  <!-- STATS VIEW -->
  <div class="view" id="view-stats">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">전체 문형</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statMastered" style="color:var(--accent2)">0</div>
        <div class="stat-label">✅ 완료</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statRemain" style="color:var(--red)">0</div>
        <div class="stat-label">📚 남은 것</div>
      </div>
    </div>

    <div style="background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;">
      <div class="mastered-list-title">✅ 완료한 문형</div>
      <div class="tag-cloud" id="masteredTagCloud"><span style="color:var(--text-muted);font-size:0.85rem;">아직 없어요!</span></div>
    </div>

    <div style="background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);">
      <div class="mastered-list-title">📚 아직 공부할 문형</div>
      <div class="tag-cloud" id="remainTagCloud"></div>
    </div>

    <button class="reset-all-btn" onclick="resetAll()">🗑 모든 진도 초기화</button>
  </div>

</main>

<script>
const GRAMMAR = [
  { pattern: "〜うちに / 〜ないうちに", meaning: "〜하는 동안에 / 〜하기 전에", exJP: "いいアイデアは忘れないうちにメモしておこう。", exKR: "좋은 아이디어는 잊어버리기 전에 메모해 두자." },
  { pattern: "お(ご)〜する(いたす)", meaning: "〜하다, 〜해 드리다", exJP: "必要な書類は期限までにお送りします。", exKR: "필요한 서류는 기한까지 보내드리겠습니다." },

// State
let mastered = new Set(JSON.parse(localStorage.getItem('n3_mastered') || '[]'));
let fcIndex = 0;
let fcMode = 'jp'; // jp or kr
let fcFlipped = false;
let fcOrder = [];
let quizData = [];
let quizIndex = 0;
let quizCorrect = 0;
let quizAnswered = false;

function saveMastered() {
  localStorage.setItem('n3_mastered', JSON.stringify([...mastered]));
  updateProgress();
}

function updateProgress() {
  const m = mastered.size;
  const t = GRAMMAR.length;
  document.getElementById('masteredCount').textContent = m;
  document.getElementById('totalCount').textContent = t;
  document.getElementById('progressFill').style.width = (m / t * 100) + '%';
}

// ========= LIST VIEW =========
function renderList(filter = '') {
  const list = document.getElementById('grammarList');
  list.innerHTML = '';
  const q = filter.toLowerCase();
  GRAMMAR.forEach((g, i) => {
    if (q && !g.pattern.toLowerCase().includes(q) && !g.meaning.toLowerCase().includes(q) && !g.exJP.toLowerCase().includes(q)) return;
    const isMastered = mastered.has(i);
    const card = document.createElement('div');
    card.className = 'grammar-card' + (isMastered ? ' mastered' : '');
    card.innerHTML = `
      <div class="card-left">
        <div class="pattern">${g.pattern}</div>
        <div class="meaning">${g.meaning}</div>
        <div class="example-jp">${g.exJP.replace(/\n/g,'<br>')}</div>
        <div class="example-kr">${g.exKR.replace(/\n/g,'<br>')}</div>
      </div>
      <div class="card-right">
        <button class="check-btn ${isMastered ? 'done' : ''}" onclick="toggleMastered(event,${i})" title="완료 표시">✓</button>
      </div>
    `;
    list.appendChild(card);
  });
}

function toggleMastered(e, i) {
  e.stopPropagation();
  if (mastered.has(i)) mastered.delete(i);
  else mastered.add(i);
  saveMastered();
  renderList(document.getElementById('searchInput').value);
  if (document.getElementById('view-stats').classList.contains('active')) renderStats();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  renderList();
}

document.getElementById('searchInput').addEventListener('input', e => renderList(e.target.value));

// ========= FLASHCARD VIEW =========
function initFlashcards() {
  fcOrder = GRAMMAR.map((_, i) => i);
  // shuffle
  for (let i = fcOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [fcOrder[i], fcOrder[j]] = [fcOrder[j], fcOrder[i]];
  }
  fcIndex = 0;
  document.getElementById('fcTotal').textContent = fcOrder.length;
  showFC();
}

function setFCMode(mode) {
  fcMode = mode;
  document.getElementById('fcModeJP').classList.toggle('active', mode === 'jp');
  document.getElementById('fcModeKR').classList.toggle('active', mode === 'kr');
  document.getElementById('flashcard').classList.remove('flipped');
  fcFlipped = false;
  document.getElementById('fcResultBtns').style.display = 'none';
  showFC();
}

function showFC() {
  const g = GRAMMAR[fcOrder[fcIndex]];
  document.getElementById('fcCurrent').textContent = fcIndex + 1;
  if (fcMode === 'jp') {
    document.getElementById('fcFrontPattern').textContent = g.pattern;
    document.getElementById('fcFrontHint').textContent = '뜻은?';
    document.getElementById('fcBackMeaning').textContent = g.meaning;
  } else {
    document.getElementById('fcFrontPattern').textContent = g.meaning;
    document.getElementById('fcFrontHint').textContent = '일본어 문형은?';
    document.getElementById('fcBackMeaning').textContent = g.pattern;
  }
  document.getElementById('fcBackExJP').textContent = g.exJP;
  document.getElementById('fcBackExKR').textContent = g.exKR;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('fcResultBtns').style.display = 'none';
  fcFlipped = false;
}

function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', fcFlipped);
  if (fcFlipped) {
    document.getElementById('fcResultBtns').style.display = 'flex';
  }
}

function fcAnswer(correct) {
  if (correct) mastered.add(fcOrder[fcIndex]);
  else mastered.delete(fcOrder[fcIndex]);
  saveMastered();
  fcNext();
}

function fcNext() {
  if (fcIndex < fcOrder.length - 1) {
    fcIndex++;
    showFC();
  } else {
    // end
    document.getElementById('fcFrontPattern').textContent = '🎉 완료!';
    document.getElementById('fcFrontHint').textContent = '처음부터 다시 하려면 아래 버튼을';
    document.getElementById('flashcard').classList.remove('flipped');
    document.getElementById('fcResultBtns').style.display = 'none';
  }
}

function fcPrev() {
  if (fcIndex > 0) {
    fcIndex--;
    showFC();
  }
}

// ========= QUIZ VIEW =========
function startQuiz() {
  // build 10 questions
  const pool = [...GRAMMAR];
  const shuffled = pool.sort(() => Math.random() - 0.5).slice(0, 10);
  quizData = shuffled.map(g => makeQuestion(g));
  quizIndex = 0;
  quizCorrect = 0;
  quizAnswered = false;
  document.getElementById('quizScoreText').textContent = '-';
  showQuizQ();
}

function makeQuestion(g) {
  // Random type: 0=meaning from pattern, 1=pattern from meaning, 2=choose example
  const type = Math.floor(Math.random() * 2);
  let q, answer, distractors;
  if (type === 0) {
    q = { prompt: g.pattern, kr: g.exKR, label: '다음 문형의 뜻은?', isKR: false };
    answer = g.meaning;
    distractors = GRAMMAR.filter(x => x.pattern !== g.pattern)
      .sort(() => Math.random() - 0.5).slice(0, 3).map(x => x.meaning);
  } else {
    q = { prompt: g.meaning, kr: g.exKR, label: '다음 뜻의 일본어 문형은?', isKR: true };
    answer = g.pattern;
    distractors = GRAMMAR.filter(x => x.meaning !== g.meaning)
      .sort(() => Math.random() - 0.5).slice(0, 3).map(x => x.pattern);
  }
  const options = [answer, ...distractors].sort(() => Math.random() - 0.5);
  return { ...q, answer, options, exJP: g.exJP, exKR: g.exKR };
}

function showQuizQ() {
  if (quizIndex >= quizData.length) {
    showQuizResult();
    return;
  }
  const q = quizData[quizIndex];
  quizAnswered = false;
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="quiz-question-card">
      <div class="quiz-type-label">${quizIndex + 1} / ${quizData.length} · ${q.label}</div>
      <div class="quiz-question">${q.prompt.replace(/\n/g,'<br>')}</div>
      <div class="quiz-kr">${q.kr}</div>
      <div class="quiz-options" id="quizOptions">
        ${q.options.map((opt, i) => `<button class="quiz-option" onclick="selectOption(${i})">${opt}</button>`).join('')}
      </div>
      <div class="quiz-feedback" id="quizFeedback"></div>
    </div>
    <div style="text-align:right;margin-top:10px">
      <button class="quiz-next-btn" id="quizNextBtn" onclick="nextQuizQ()" style="display:none">다음 ▶</button>
    </div>
  `;
}

function selectOption(idx) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = quizData[quizIndex];
  const opts = document.querySelectorAll('.quiz-option');
  const selected = opts[idx].textContent.trim();
  const correct = selected === q.answer;
  if (correct) quizCorrect++;

  opts.forEach(btn => {
    btn.disabled = true;
    if (btn.textContent.trim() === q.answer) btn.classList.add('correct');
    else if (btn === opts[idx] && !correct) btn.classList.add('wrong');
  });

  const fb = document.getElementById('quizFeedback');
  fb.style.display = 'block';
  if (correct) {
    fb.className = 'quiz-feedback correct-fb';
    fb.innerHTML = `✅ 정답! <br><strong>예문:</strong> ${q.exJP}<br>${q.exKR}`;
  } else {
    fb.className = 'quiz-feedback wrong-fb';
    fb.innerHTML = `❌ 오답! 정답: <strong>${q.answer}</strong><br>${q.exJP}<br>${q.exKR}`;
  }
  document.getElementById('quizNextBtn').style.display = 'inline-block';
  document.getElementById('quizScoreText').textContent = `${quizCorrect}/${quizIndex + 1}`;
}

function nextQuizQ() {
  quizIndex++;
  showQuizQ();
}

function showQuizResult() {
  const pct = Math.round(quizCorrect / quizData.length * 100);
  let emoji = pct >= 80 ? '🎉' : pct >= 50 ? '😊' : '😅';
  let msg = pct >= 80 ? '훌륭해요!' : pct >= 50 ? '잘 하고 있어요!' : '조금 더 연습해봐요!';
  document.getElementById('quizArea').innerHTML = `
    <div class="quiz-result">
      <div class="result-emoji">${emoji}</div>
      <div class="result-title">${msg}</div>
      <div class="result-score">${pct}%</div>
      <div class="result-detail">${quizCorrect} / ${quizData.length} 정답</div>
      <button class="quiz-start-btn" onclick="startQuiz()">다시 도전!</button>
    </div>
  `;
  document.getElementById('quizScoreText').textContent = `${quizCorrect}/${quizData.length}`;
}

// ========= STATS VIEW =========
function renderStats() {
  const t = GRAMMAR.length;
  const m = mastered.size;
  document.getElementById('statTotal').textContent = t;
  document.getElementById('statMastered').textContent = m;
  document.getElementById('statRemain').textContent = t - m;

  const mc = document.getElementById('masteredTagCloud');
  const rc = document.getElementById('remainTagCloud');
  mc.innerHTML = '';
  rc.innerHTML = '';

  let hasMastered = false;
  GRAMMAR.forEach((g, i) => {
    const tag = document.createElement('span');
    tag.className = 'tag ' + (mastered.has(i) ? 'mastered-tag' : 'not-yet-tag');
    tag.textContent = g.pattern;
    if (mastered.has(i)) { mc.appendChild(tag); hasMastered = true; }
    else rc.appendChild(tag);
  });
  if (!hasMastered) mc.innerHTML = '<span style="color:var(--text-muted);font-size:0.85rem;">아직 없어요!</span>';
}

function resetAll() {
  if (!confirm('모든 진도를 초기화할까요?')) return;
  mastered.clear();
  saveMastered();
  renderList();
  renderStats();
}

// ========= TABS =========
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    const viewId = 'view-' + btn.dataset.view;
    document.getElementById(viewId).classList.add('active');
    if (btn.dataset.view === 'flashcard') initFlashcards();
    if (btn.dataset.view === 'stats') renderStats();
  });
});

// ========= INIT =========
updateProgress();
renderList();
</script>
</body>
</html>
