<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>원소 주기율표 암기 퀴즈</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --primary-color: #007aff;
            --text-color: #1c1c1e;
            --sub-text: #8e8e93;
            --correct-color: #34c759;
            --wrong-color: #ff3b30;
            --border-color: #e5e5ea;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .btn {
            width: 100%;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            margin-bottom: 12px;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .mode-btn {
            background-color: #f2f2f7;
            color: var(--primary-color);
            border: 1px solid var(--border-color);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #e5e5ea;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .question-box {
            background-color: #f8f9fa;
            border-radius: 16px;
            padding: 30px 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .question-title {
            font-size: 0.9rem;
            color: var(--sub-text);
            margin-bottom: 10px;
        }

        .question-main {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .option-btn {
            padding: 16px 10px;
            font-size: 1.1rem;
            font-weight: 600;
            background-color: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn.correct {
            background-color: var(--correct-color);
            border-color: var(--correct-color);
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            border-color: var(--wrong-color);
            color: white;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-color);
            margin: 20px 0;
        }

        .score-text {
            font-size: 1.1rem;
            color: var(--sub-text);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 메인 화면 -->
    <div id="start-screen" class="screen active">
        <h1>🧪 원소 주기율표 퀴즈</h1>
        <p style="color: var(--sub-text); margin-bottom: 24px;">학습할 모드를 선택하세요 (10문항)</p>
        <button class="btn mode-btn" onclick="startQuiz('symbolToName')">1. 원소기호 → 한글명칭</button>
        <button class="btn mode-btn" onclick="startQuiz('nameToSymbol')">2. 한글명칭 → 원소기호</button>
    </div>

    <!-- 퀴즈 진행 화면 -->
    <div id="quiz-screen" class="screen">
        <div class="progress-bar">
            <div id="progress" class="progress"></div>
        </div>
        <div class="question-box">
            <div id="question-title" class="question-title">다음 원소기호의 한글 명칭은?</div>
            <div id="question-main" class="question-main">H</div>
        </div>
        <div id="options" class="options-grid">
            <!-- 보기 버튼들이 동적으로 생성됩니다 -->
        </div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="screen">
        <h1>🎉 학습 완료!</h1>
        <div id="score-display" class="score-display">80점</div>
        <div id="score-text" class="score-text">10문제 중 8문제를 맞췄습니다.</div>
        <button class="btn" onclick="showStartScreen()">다시 풀기</button>
    </div>
</div>

<script>
    // 주요 원소 30개 데이터
    const elements = [
        { symbol: "H", name: "수소" }, { symbol: "He", name: "헬륨" },
        { symbol: "Li", name: "리튬" }, { symbol: "Be", name: "베릴륨" },
        { symbol: "B", name: "붕소" }, { symbol: "C", name: "탄소" },
        { symbol: "N", name: "질소" }, { symbol: "O", name: "산소" },
        { symbol: "F", name: "플루오린" }, { symbol: "Ne", name: "네온" },
        { symbol: "Na", name: "나트륨" }, { symbol: "Mg", name: "마그네슘" },
        { symbol: "Al", name: "알루미늄" }, { symbol: "Si", name: "규소" },
        { symbol: "P", name: "인" }, { symbol: "S", name: "황" },
        { symbol: "Cl", name: "염소" }, { symbol: "Ar", name: "아르곤" },
        { symbol: "K", name: "칼륨" }, { symbol: "Ca", name: "칼슘" },
        { symbol: "Fe", name: "철" }, { symbol: "Cu", name: "구리" },
        { symbol: "Zn", name: "아연" }, { symbol: "Ag", name: "은" },
        { symbol: "Au", name: "금" }, { symbol: "Hg", name: "수은" },
        { symbol: "Pb", name: "납" }, { symbol: "I", name: "아이오딘" },
        { symbol: "Ba", name: "바륨" }, { symbol: "U", name: "우라늄" }
    ];

    let currentMode = '';
    let quizQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswering = false;

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function showStartScreen() {
        showScreen('start-screen');
    }

    function startQuiz(mode) {
        currentMode = mode;
        score = 0;
        currentQuestionIndex = 0;
        
        // 원소 목록을 섞어서 10개 추출
        const shuffled = [...elements].sort(() => 0.5 - Math.random());
        quizQuestions = shuffled.slice(0, 10);

        showScreen('quiz-screen');
        nextQuestion();
    }

    function nextQuestion() {
        if (currentQuestionIndex >= 10) {
            showResult();
            return;
        }

        isAnswering = true;
        const currentQ = quizQuestions[currentQuestionIndex];
        
        // 진행 바 업데이트
        document.getElementById('progress').style.width = `${((currentQuestionIndex) / 10) * 100}%`;

        // 문제 및 제목 설정
        const titleEl = document.getElementById('question-title');
        const mainEl = document.getElementById('question-main');

        if (currentMode === 'symbolToName') {
            titleEl.textContent = '다음 원소기호의 한글 명칭은?';
            mainEl.textContent = currentQ.symbol;
        } else {
            titleEl.textContent = '다음 한글 명칭의 원소기호는?';
            mainEl.textContent = currentQ.name;
        }

        // 보기 생성 (정답 1개 + 오답 3개)
        const options = generateOptions(currentQ);
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = currentMode === 'symbolToName' ? opt.name : opt.symbol;
            btn.onclick = () => checkAnswer(btn, opt, currentQ);
            optionsContainer.appendChild(btn);
        });
    }

    function generateOptions(correctElement) {
        const wrongCandidates = elements.filter(e => e.symbol !== correctElement.symbol);
        const shuffledWrong = wrongCandidates.sort(() => 0.5 - Math.random()).slice(0, 3);
        const allOptions = [correctElement, ...shuffledWrong];
        return allOptions.sort(() => 0.5 - Math.random());
    }

    function checkAnswer(selectedBtn, selectedOpt, correctQ) {
        if (!isAnswering) return;
        isAnswering = false;

        const isCorrect = selectedOpt.symbol === correctQ.symbol;
        const buttons = document.querySelectorAll('.option-btn');

        if (isCorrect) {
            selectedBtn.classList.add('correct');
            score++;
        } else {
            selectedBtn.classList.add('wrong');
            // 정답 버튼 표시
            buttons.forEach(btn => {
                const targetValue = currentMode === 'symbolToName' ? correctQ.name : correctQ.symbol;
                if (btn.textContent === targetValue) {
                    btn.classList.add('correct');
                }
            });
        }

        // 0.8초 후 다음 문제로
        setTimeout(() => {
            currentQuestionIndex++;
            nextQuestion();
        }, 800);
    }

    function showResult() {
        showScreen('result-screen');
        const finalScore = score * 10;
        document.getElementById('score-display').textContent = `${finalScore}점`;
        document.getElementById('score-text').textContent = `10문제 중 ${score}문제를 맞췄습니다.`;
    }
</script>

</body>
</html>
