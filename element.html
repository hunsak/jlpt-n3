<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원소 주기율표 학습기</title>
  <style>
    :root {
      --primary-color: #4a90e2;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    /* Mode Navigation */
    .mode-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mode-btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid var(--primary-color);
      background-color: white;
      color: var(--primary-color);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background-color: var(--primary-color);
      color: white;
    }

    /* Container Area */
    .view-section {
      width: 100%;
      max-width: 650px;
    }

    .hidden {
      display: none !important;
    }

    /* Quiz Mode Styles */
    .quiz-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    .quiz-options {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
      font-size: 15px;
      font-weight: 500;
      background-color: #f8f9fa;
      padding: 10px;
      border-radius: 8px;
    }

    .quiz-options input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .quiz-question {
      font-size: 52px;
      font-weight: bold;
      color: var(--primary-color);
      margin: 15px 0;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 사지선다 버튼 그리드 */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .option-btn {
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      background-color: #f8f9fa;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #333;
    }

    .option-btn:hover:not(:disabled) {
      background-color: #e9ecef;
      border-color: var(--primary-color);
    }

    .option-btn.correct {
      background-color: #28a745 !important;
      color: white !important;
      border-color: #28a745 !important;
    }

    .option-btn.wrong {
      background-color: #dc3545 !important;
      color: white !important;
      border-color: #dc3545 !important;
    }

    .quiz-feedback {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      min-height: 27px;
    }

    /* Full List Mode Styles */
    .list-container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .list-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 2px solid #eee;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 180px;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    select {
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: white;
      cursor: pointer;
    }

    .toggle-btn {
      padding: 8px 16px;
      font-size: 14px;
      background-color: #6c757d;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
    }

    .toggle-btn.active {
      background-color: #28a745;
    }

    .progress-bar-container {
      margin-top: 5px;
      font-size: 14px;
      font-weight: bold;
      color: var(--primary-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clear-btn {
      background: none;
      border: none;
      color: #dc3545;
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Scrollable Table Area */
    .scrollable-list {
      max-height: 450px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    th, td {
      padding: 12px 8px;
      border-bottom: 1px solid #eee;
    }

    th {
      background-color: #f8f9fa;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    /* 숨김(가림) 및 개별 클릭 가능 커스텀 마스크 */
    .masked {
      background-color: #e9ecef;
      color: transparent !important;
      user-select: none;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }

    .masked::after {
      content: "???";
      color: #adb5bd;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    /* 클릭 시 직접 보이기 상태 클래스 */
    .revealed {
      background-color: transparent !important;
      color: inherit !important;
      cursor: pointer;
    }

    .revealed::after {
      content: "" !important;
    }

    .completed-row {
      background-color: #f0fff4;
    }

    .no-result {
      padding: 20px;
      color: #777;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>원소 주기율표 학습기</h1>

  <!-- 모드 전환 버튼 -->
  <div class="mode-nav">
    <button id="btn-mode-quiz" class="mode-btn active" onclick="switchMode('quiz')">퀴즈 모드</button>
    <button id="btn-mode-list" class="mode-btn" onclick="switchMode('list')">전체 목록 모드</button>
  </div>

  <!-- 1. 퀴즈 모드 영역 -->
  <div id="quiz-section" class="view-section">
    <div class="quiz-card">
      <div class="quiz-options">
        <label style="cursor: pointer;">
          <input type="checkbox" id="unmemorized-only" onchange="nextQuiz()">
          🎯 아직 못 외운 원소만 출제하기
        </label>
      </div>

      <div>다음 원소 기호에 해당하는 한글 이름을 선택하세요</div>
      <div id="quiz-symbol" class="quiz-question">H</div>
      
      <!-- 사지선다 버튼 4개 -->
      <div id="options-grid" class="options-grid">
        <button class="option-btn" onclick="checkAnswer(0)"></button>
        <button class="option-btn" onclick="checkAnswer(1)"></button>
        <button class="option-btn" onclick="checkAnswer(2)"></button>
        <button class="option-btn" onclick="checkAnswer(3)"></button>
      </div>

      <div id="quiz-feedback" class="quiz-feedback"></div>
    </div>
  </div>

  <!-- 2. 전체 목록 모드 영역 -->
  <div id="list-section" class="view-section hidden">
    <div class="list-container">
      <div class="list-controls">
        <div class="control-row">
          <input type="text" id="search-input" class="search-input" placeholder="원소명/기호/번호 검색..." oninput="renderTable()">
          
          <select id="sort-select" onchange="renderTable()">
            <option value="asc">번호순</option>
            <option value="random">랜덤순</option>
          </select>

          <select id="limit-select" onchange="renderTable()">
            <!-- 자바스크립트로 옵션 자동 생성 -->
          </select>
        </div>

        <div class="control-row">
          <button id="toggle-symbol-btn" class="toggle-btn" onclick="toggleVisibility('symbol')">원소기호 숨기기</button>
          <button id="toggle-name-btn" class="toggle-btn" onclick="toggleVisibility('name')">한글이름 숨기기</button>
        </div>

        <div class="progress-bar-container">
          <span id="progress-text">암기 완료: 0 / 118 (0%)</span>
          <button class="clear-btn" onclick="resetMemorized()">기록 초기화</button>
        </div>
      </div>
      
      <div class="scrollable-list">
        <table>
          <thead>
            <tr>
              <th>암기</th>
              <th>번호</th>
              <th>원소 기호</th>
              <th>한글 이름</th>
            </tr>
          </thead>
          <tbody id="element-table-body">
            <!-- 자바스크립트로 동적 생성됨 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

    // 상태 변수
    let currentQuizElement = null;
    let quizOptionsData = [];
    let isAnswered = false;
    
    let hideSymbol = false;
    let hideName = false;
    
    let memorizedList = JSON.parse(localStorage.getItem('memorizedElements')) || [];

    window.onload = function() {
      initLimitSelect();
      nextQuiz();
      updateProgress();
    };

    function initLimitSelect() {
      const select = document.getElementById('limit-select');
      select.innerHTML = '';

      for (let i = 20; i < elements.length; i += 10) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `${i}개씩 보기`;
        select.appendChild(opt);
      }

      const allOpt = document.createElement('option');
      allOpt.value = 'all';
      allOpt.innerText = '전체 보기';
      allOpt.selected = true;
      select.appendChild(allOpt);
    }

    function switchMode(mode) {
      const quizSection = document.getElementById('quiz-section');
      const listSection = document.getElementById('list-section');
      const btnQuiz = document.getElementById('btn-mode-quiz');
      const btnList = document.getElementById('btn-mode-list');

      if (mode === 'quiz') {
        quizSection.classList.remove('hidden');
        listSection.classList.add('hidden');
        btnQuiz.classList.add('active');
        btnList.classList.remove('active');
        nextQuiz();
      } else {
        quizSection.classList.add('hidden');
        listSection.classList.remove('hidden');
        btnQuiz.classList.remove('active');
        btnList.classList.add('active');
        renderTable();
      }
    }

    /* 퀴즈 모드 로직 (4지선다형) */
    function nextQuiz() {
      isAnswered = false;
      const isUnmemorizedOnly = document.getElementById('unmemorized-only').checked;
      let targetPool = elements;

      if (isUnmemorizedOnly) {
        targetPool = elements.filter(el => !memorizedList.includes(el.num));
      }

      const symbolElem = document.getElementById('quiz-symbol');
      const optionsGrid = document.getElementById('options-grid');
      const feedback = document.getElementById('quiz-feedback');
      const buttons = optionsGrid.querySelectorAll('.option-btn');

      feedback.innerText = '';
      
      // 버튼 스타일 초기화
      buttons.forEach(btn => {
        btn.className = 'option-btn';
        btn.disabled = false;
      });

      if (targetPool.length === 0) {
        symbolElem.style.fontSize = '24px';
        symbolElem.innerText = '🎉 모든 원소를 암기하셨습니다!';
        buttons.forEach(btn => {
          btn.innerText = '-';
          btn.disabled = true;
        });
        currentQuizElement = null;
        return;
      }

      symbolElem.style.fontSize = '52px';
      
      // 문제 원소 선정
      const randomIndex = Math.floor(Math.random() * targetPool.length);
      currentQuizElement = targetPool[randomIndex];
      symbolElem.innerText = currentQuizElement.symbol;

      // 오답 선택지 3개 추출 (전체 원소 중 선정)
      const wrongCandidates = elements.filter(el => el.num !== currentQuizElement.num);
      const shuffledWrong = wrongCandidates.sort(() => Math.random() - 0.5).slice(0, 3);

      // 정답 + 오답 3개 섞기
      quizOptionsData = [currentQuizElement, ...shuffledWrong].sort(() => Math.random() - 0.5);

      // 보기 버튼 세팅
      buttons.forEach((btn, index) => {
        btn.innerText = `${index + 1}. ${quizOptionsData[index].name}`;
      });
    }

    function checkAnswer(selectedIndex) {
      if (isAnswered || !currentQuizElement) return;
      isAnswered = true;

      const buttons = document.querySelectorAll('.option-btn');
      const selectedOption = quizOptionsData[selectedIndex];
      const feedback = document.getElementById('quiz-feedback');

      if (selectedOption.num === currentQuizElement.num) {
        buttons[selectedIndex].classList.add('correct');
        feedback.style.color = 'green';
        feedback.innerText = '정답입니다! 🎉';

        // 정답 시 자동으로 암기 처리
        toggleMemorize(currentQuizElement.num, true);

        setTimeout(nextQuiz, 1000);
      } else {
        buttons[selectedIndex].classList.add('wrong');
        
        // 정답 버튼 표시해주기
        quizOptionsData.forEach((opt, idx) => {
          if (opt.num === currentQuizElement.num) {
            buttons[idx].classList.add('correct');
          }
        });

        feedback.style.color = 'red';
        feedback.innerText = `틀렸습니다. 정답은 '${currentQuizElement.name}'입니다.`;

        setTimeout(nextQuiz, 2000);
      }
    }

    /* 전체 목록 모드 로직 */
    function renderTable() {
      const tbody = document.getElementById('element-table-body');
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const sortType = document.getElementById('sort-select').value;
      const limitVal = document.getElementById('limit-select').value;

      tbody.innerHTML = '';

      let list = elements.filter(item => 
        item.name.toLowerCase().includes(query) ||
        item.symbol.toLowerCase().includes(query) ||
        item.num.toString().includes(query)
      );

      if (sortType === 'random') {
        list = [...list].sort(() => Math.random() - 0.5);
      } else {
        list = [...list].sort((a, b) => a.num - b.num);
      }

      if (limitVal !== 'all') {
        const limit = parseInt(limitVal, 10);
        list = list.slice(0, limit);
      }

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="no-result">검색 결과가 없습니다.</td></tr>';
        return;
      }

      list.forEach(item => {
        const tr = document.createElement('tr');
        const isMemorized = memorizedList.includes(item.num);
        
        if (isMemorized) {
          tr.classList.add('completed-row');
        }

        // 1. 체크박스
        const tdCheck = document.createElement('td');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = isMemorized;
        checkbox.onchange = (e) => toggleMemorize(item.num, e.target.checked);
        tdCheck.appendChild(checkbox);

        // 2. 번호
        const tdNum = document.createElement('td');
        tdNum.innerText = item.num;

        // 3. 기호
        const tdSymbol = document.createElement('td');
        tdSymbol.innerText = item.symbol;
        if (hideSymbol) {
          tdSymbol.classList.add('masked');
          // 개별 클릭으로 토글 가능하도록 온클릭 이벤트 부여
          tdSymbol.onclick = () => tdSymbol.classList.toggle('revealed');
        }

        // 4. 이름
        const tdName = document.createElement('td');
        tdName.innerText = item.name;
        if (hideName) {
          tdName.classList.add('masked');
          // 개별 클릭으로 토글 가능하도록 온클릭 이벤트 부여
          tdName.onclick = () => tdName.classList.toggle('revealed');
        }

        tr.appendChild(tdCheck);
        tr.appendChild(tdNum);
        tr.appendChild(tdSymbol);
        tr.appendChild(tdName);
        tbody.appendChild(tr);
      });
    }

    // 암기 상태 토글 및 localStorage 저정
    function toggleMemorize(num, isChecked) {
      if (isChecked) {
        if (!memorizedList.includes(num)) memorizedList.push(num);
      } else {
        memorizedList = memorizedList.filter(n => n !== num);
      }
      
      localStorage.setItem('memorizedElements', JSON.stringify(memorizedList));
      updateProgress();
      
      if (!document.getElementById('list-section').classList.contains('hidden')) {
        renderTable();
      }
    }

    function updateProgress() {
      const count = memorizedList.length;
      const total = elements.length;
      const percent = Math.round((count / total) * 100);
      document.getElementById('progress-text').innerText = `암기 완료: ${count} / ${total} (${percent}%)`;
    }

    function resetMemorized() {
      if (confirm('암기 체크 기록을 모두 초기화하시겠습니까?')) {
        memorizedList = [];
        localStorage.removeItem('memorizedElements');
        updateProgress();
        renderTable();
      }
    }

    function toggleVisibility(target) {
      if (target === 'symbol') {
        hideSymbol = !hideSymbol;
        const btn = document.getElementById('toggle-symbol-btn');
        btn.innerText = hideSymbol ? '원소기호 보이기' : '원소기호 숨기기';
        btn.classList.toggle('active', hideSymbol);
      } else if (target === 'name') {
        hideName = !hideName;
        const btn = document.getElementById('toggle-name-btn');
        btn.innerText = hideName ? '한글이름 보이기' : '한글이름 숨기기';
        btn.classList.toggle('active', hideName);
      }
      renderTable();
    }
  </script>
</body>
</html>
