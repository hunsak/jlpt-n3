<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS 웹 앱 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="원소 퀴즈">
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    
    <title>원소 주기율표 퀴즈</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --primary-color: #38bdf8;
            --primary-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --text-color: #f8fafc;
            --sub-text: #94a3b8;
            --correct-color: #4ade80;
            --wrong-color: #f87171;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
        }

        /* 꽉 찬 앱 배경 그래픽 오버레이 */
        .app-bg-decor {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
        }
        .bg-circle-1 {
            width: 300px;
            height: 300px;
            background: #38bdf8;
            top: -50px;
            left: -50px;
        }
        .bg-circle-2 {
            width: 350px;
            height: 350px;
            background: #c084fc;
            bottom: -80px;
            right: -50px;
        }

        .app-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px) 20px;
            max-width: 480px;
            margin: 0 auto;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            padding: 28px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 메인 일러스트 스타일 */
        .hero-illustration {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-illustration svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 15px rgba(56, 189, 248, 0.3));
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-title {
            color: var(--sub-text);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .screen { display: none; width: 100%; }
        .screen.active { display: block; }

        .settings-section {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .settings-label {
            font-size: 0.85rem;
            color: var(--sub-text);
            font-weight: 600;
            margin-bottom: 12px;
            display: block;
        }

        .segmented-control {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 3px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .segmented-control::-webkit-scrollbar { display: none; }

        .segmented-control label { flex: 1; min-width: 44px; text-align: center; }
        .segmented-control input { display: none; }
        .segmented-control span {
            display: block;
            padding: 8px 0;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--sub-text);
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .segmented-control input:checked + span {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .btn {
            width: 100%;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            border-radius: 18px;
            background: var(--primary-gradient);
            color: white;
            cursor: pointer;
            margin-bottom: 12px;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.25);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.97); }
        .btn.secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            box-shadow: none;
            color: var(--text-color);
        }
        .btn:disabled {
            opacity: 0.4;
            transform: none;
            box-shadow: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress {
            width: 0%;
            height: 100%;
            background: var(--primary-gradient);
            transition: width 0.3s ease;
        }

        .question-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 24px;
            padding: 30px 15px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }
        .question-title { font-size: 0.9rem; color: var(--sub-text); margin-bottom: 10px; }
        .question-main { font-size: 3.5rem; font-weight: 800; color: #ffffff; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .option-btn {
            padding: 18px 10px;
            font-size: 1.15rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .option-btn.correct { background: var(--correct-color) !important; color: #0f172a !important; border-color: var(--correct-color) !important; }
        .option-btn.wrong { background: var(--wrong-color) !important; color: #ffffff !important; border-color: var(--wrong-color) !important; }

        .score-display { font-size: 4.5rem; font-weight: 900; color: var(--primary-color); margin: 10px 0; text-shadow: 0 0 30px rgba(56, 189, 248, 0.4); }
        .score-text { font-size: 1.05rem; color: var(--sub-text); margin-bottom: 20px; }
        .remain-text { font-size: 0.95rem; color: var(--primary-color); margin-bottom: 15px; font-weight: 700; }

        /* 폭죽 전용 캔버스 */
        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>

<!-- 효과 폭죽 캔버스 -->
<canvas id="fx-canvas"></canvas>

<!-- 배경 일러스트 효과 -->
<div class="app-bg-decor">
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
</div>

<div class="app-wrapper">
    <div class="container">
        
        <!-- 메인 시작 화면 -->
        <div id="start-screen" class="screen active">
            <!-- 시각적 몰입감을 위한 과학 원소 일러스트 SVG -->
            <div class="hero-illustration">
                <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="80" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8" opacity="0.4"/>
                    <ellipse cx="100" cy="100" rx="75" ry="28" stroke="#818cf8" stroke-width="3" transform="rotate(30 100 100)"/>
                    <ellipse cx="100" cy="100" rx="75" ry="28" stroke="#38bdf8" stroke-width="3" transform="rotate(-30 100 100)"/>
                    <circle cx="100" cy="100" r="28" fill="url(#grad1)"/>
                    <text x="100" y="108" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">118</text>
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#38bdf8"/>
                            <stop offset="100%" stop-color="#c084fc"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            
            <h1>원소 주기율표 퀴즈</h1>
            <p class="sub-title">전체 118개 원소를 마스터해보세요!</p>
            
            <div class="settings-section">
                <label class="settings-label">문제 갯수 선택</label>
                <div class="segmented-control" id="quantity-selector"></div>
            </div>

            <button class="btn" onclick="startQuiz('symbolToName')">1. 원소기호 → 한글명칭</button>
            <button class="btn secondary" onclick="startQuiz('nameToSymbol')">2. 한글명칭 → 원소기호</button>
        </div>

        <!-- 퀴즈 진행 화면 -->
        <div id="quiz-screen" class="screen">
            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
            <div class="question-box">
                <div id="question-title" class="question-title">문제</div>
                <div id="question-main" class="question-main">H</div>
            </div>
            <div id="options" class="options-grid"></div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="screen">
            <h1>라운드 완료!</h1>
            <div id="score-display" class="score-display">0점</div>
            <div id="score-text" class="score-text">10문제 중 0문제를 맞췄습니다.</div>
            
            <div class="settings-section">
                <p id="remain-count-text" class="remain-text">남은 안 푼 원소: 108개 / 118개</p>
                <label class="settings-label">다음 라운드 문제 갯수</label>
                <div class="segmented-control" id="result-quantity-selector"></div>
            </div>

            <button id="continue-btn" class="btn" onclick="continueQuiz()">안 푼 문제 이어서 풀기</button>
            <button class="btn secondary" onclick="showStartScreen()">처음부터 다시 하기</button>
        </div>

    </div>
</div>

        { id: 89, symbol: "Ac", name: "악티늄" }, { id: 90, symbol: "Th", name: "토륨" },
        { id: 91, symbol: "Pa", name: "프로탁티늄" }, { id: 92, symbol: "U", name: "우라늄" },
        { id: 93, symbol: "Np", name: "넵투늄" }, { id: 94, symbol: "Pu", name: "플루토늄" },

        { id: 99, symbol: "Es", name: "아인슈타이니움" }, { id: 100, symbol: "Fm", name: "페르뮴" },
        { id: 101, symbol: "Md", name: "멘델레븀" }, { id: 102, symbol: "No", name: "노벨륨" },
        { id: 103, symbol: "Lr", name: "로렌슘" }, { id: 104, symbol: "Rf", name: "러더퍼듐" },
        { id: 105, symbol: "Db", name: "더브늄" }, { id: 106, symbol: "Sg", name: "시보늄" },
        { id: 107, symbol: "Bh", name: "보륨" }, { id: 108, symbol: "Hs", name: "하슘" },
        { id: 109, symbol: "Mt", name: "마이트너륨" }, { id: 110, symbol: "Ds", name: "다름슈타튬" },
        { id: 111, symbol: "Rg", name: "뢴트게늄" }, { id: 112, symbol: "Cn", name: "코페르니슘" },
        { id: 113, symbol: "Nh", name: "니호늄" }, { id: 114, symbol: "Fl", name: "플레로븀" },
        { id: 115, symbol: "Mc", name: "모스코븀" }, { id: 116, symbol: "Lv", name: "리버모륨" },
        { id: 117, symbol: "Ts", name: "테네신" }, { id: 118, symbol: "Og", name: "오가네손" }
    ];

    const quantityOptions = [5, 10, 15, 20, 25, 30];

    let currentMode = '';
    let unallocatedElementIds = [];
    let currentRoundQuestions = [];
    let currentQuestionIndex = 0;
    let roundScore = 0;
    let isAnswering = false;

    function initApp() {
        renderQuantitySelectors();
        resetLearningRecord();
        initCanvas();
    }

    function resetLearningRecord() {
        unallocatedElementIds = elementsData.map(e => e.id);
    }

    function renderQuantitySelectors() {
        const containers = [document.getElementById('quantity-selector'), document.getElementById('result-quantity-selector')];
        
        containers.forEach((container, idx) => {
            container.innerHTML = '';
            const suffix = idx === 0 ? 'start' : 'result';

            quantityOptions.forEach((qty) => {
                const label = document.createElement('label');
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = `quiz-qty-${suffix}`;
                input.value = qty;
                if (qty === 10) input.checked = true;

                const span = document.createElement('span');
                span.textContent = qty;

                label.appendChild(input);
                label.appendChild(span);
                container.appendChild(label);
            });
        });
    }

    function getSelectedQuantity(screenType) {
        const selectorId = screenType === 'start' ? 'quantity-selector' : 'result-quantity-selector';
        return parseInt(document.querySelector(`#${selectorId} input:checked`).value);
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function showStartScreen() {
        resetLearningRecord();
        showScreen('start-screen');
    }

    function startQuiz(mode) {
        currentMode = mode;
        resetLearningRecord();
        prepareRound('start');
    }

    function continueQuiz() {
        prepareRound('result');
    }

    function prepareRound(fromScreen) {
        const requestedQty = getSelectedQuantity(fromScreen);
        const shuffledRemainingIds = unallocatedElementIds.sort(() => 0.5 - Math.random());
        const finalQty = Math.min(requestedQty, shuffledRemainingIds.length);
        const selectedIds = shuffledRemainingIds.slice(0, finalQty);

        if (finalQty === 0) {
            alert("118개 모든 원소를 완료했습니다! 처음부터 다시 시작합니다.");
            showStartScreen();
            return;
        }

        currentRoundQuestions = selectedIds.map(id => elementsData.find(e => e.id === id));
        unallocatedElementIds = unallocatedElementIds.filter(id => !selectedIds.includes(id));

        roundScore = 0;
        currentQuestionIndex = 0;
        showScreen('quiz-screen');
        nextQuestion();
    }

    function nextQuestion() {
        if (currentQuestionIndex >= currentRoundQuestions.length) {
            showResult();
            return;
        }

        isAnswering = true;
        const currentQ = currentRoundQuestions[currentQuestionIndex];
        const totalInRound = currentRoundQuestions.length;
        
        document.getElementById('progress').style.width = `${((currentQuestionIndex) / totalInRound) * 100}%`;

        const titleEl = document.getElementById('question-title');
        const mainEl = document.getElementById('question-main');

        if (currentMode === 'symbolToName') {
            titleEl.textContent = '다음 원소기호의 한글 명칭은?';
            mainEl.textContent = currentQ.symbol;
        } else {
            titleEl.textContent = '다음 한글 명칭의 원소기호는?';
            mainEl.textContent = currentQ.name;
        }

        const options = generateOptions(currentQ);
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = currentMode === 'symbolToName' ? opt.name : opt.symbol;
            btn.onclick = () => checkAnswer(btn, opt, currentQ);
            optionsContainer.appendChild(btn);
        });
    }

    function generateOptions(correctElement) {
        const wrongCandidates = elementsData.filter(e => e.id !== correctElement.id);
        const shuffledWrong = wrongCandidates.sort(() => 0.5 - Math.random()).slice(0, 3);
        const allOptions = [correctElement, ...shuffledWrong];
        return allOptions.sort(() => 0.5 - Math.random());
    }

    function checkAnswer(selectedBtn, selectedOpt, correctQ) {
        if (!isAnswering) return;
        isAnswering = false;

        const isCorrect = selectedOpt.id === correctQ.id;
        const buttons = document.querySelectorAll('.option-btn');

        if (isCorrect) {
            selectedBtn.classList.add('correct');
            roundScore++;
        } else {
            selectedBtn.classList.add('wrong');
            buttons.forEach(btn => {
                const targetValue = currentMode === 'symbolToName' ? correctQ.name : correctQ.symbol;
                if (btn.textContent === targetValue) {
                    btn.classList.add('correct');
                }
            });
        }

        setTimeout(() => {
            currentQuestionIndex++;
            nextQuestion();
        }, 600);
    }

    function showResult() {
        showScreen('result-screen');
        const totalInRound = currentRoundQuestions.length;
        const finalScore = Math.round((roundScore / totalInRound) * 100);
        const remainCount = unallocatedElementIds.length;

        document.getElementById('score-display').textContent = `${finalScore}점`;
        document.getElementById('score-text').textContent = `${totalInRound}문제 중 ${roundScore}문제를 맞췄습니다.`;
        document.getElementById('remain-count-text').textContent = `남은 안 푼 원소: ${remainCount}개 / 118개`;

        const continueBtn = document.getElementById('continue-btn');
        if (remainCount === 0) {
            continueBtn.disabled = true;
            continueBtn.textContent = "모든 원소(118개) 학습 완료!";
        } else {
            continueBtn.disabled = false;
            continueBtn.textContent = "안 푼 문제 이어서 풀기";
        }

        // 점수대별 맞춤 폭죽 애니메이션 발생
        triggerScoreEffect(finalScore);
    }

    /* -------------------------------------------
     * 점수별 맞춤 폭죽(Confetti) Canvas 엔진
     * ------------------------------------------- */
    let canvas, ctx;
    let particles = [];

    function initCanvas() {
        canvas = document.getElementById('fx-canvas');
        ctx = canvas.getContext('2d');
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function triggerScoreEffect(score) {
        particles = [];
        let count = 0;
        let colors = [];
        let isRain = false;

        if (score === 100) {
            count = 220; // 100점: 골드/퍼플 대형 세레머니
            colors = ['#ffd700', '#38bdf8', '#c084fc', '#ffffff', '#f43f5e'];
        } else if (score >= 90) {
            count = 150; // 90점대: 풍성한 컬러 폭죽
            colors = ['#38bdf8', '#4ade80', '#c084fc', '#facc15'];
        } else if (score >= 80) {
            count = 100; // 80점대: 표준 축하 폭죽
            colors = ['#38bdf8', '#818cf8', '#4ade80'];
        } else if (score >= 70) {
            count = 60;  // 70점대: 은은한 폭죽
            colors = ['#38bdf8', '#94a3b8', '#ffffff'];
        } else if (score >= 60) {
            count = 30;  // 60점대: 소형 폭죽
            colors = ['#94a3b8', '#cbd5e1'];
        } else {
            count = 40;  // 50점 이하: 아쉬운 감정을 담은 하강 애니메이션
            colors = ['#64748b', '#475569', '#38bdf8'];
            isRain = true;
        }

        for (let i = 0; i < count; i++) {
            particles.push({
                x: isRain ? Math.random() * canvas.width : canvas.width / 2,
                y: isRain ? -20 : canvas.height / 2 + 50,
                vx: isRain ? (Math.random() - 0.5) * 2 : (Math.random() - 0.5) * (score >= 90 ? 18 : 12),
                vy: isRain ? Math.random() * 5 + 3 : (Math.random() - 0.7) * (score >= 90 ? 20 : 14),
                size: Math.random() * 8 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                alpha: 1,
                decay: Math.random() * 0.015 + 0.008,
                gravity: isRain ? 0.1 : 0.25
            });
        }

        requestAnimationFrame(renderEffect);
    }

    function renderEffect() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach((p, index) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.alpha -= p.decay;

            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if (p.alpha <= 0) {
                particles.splice(index, 1);
            }
        });

        if (particles.length > 0) {
            requestAnimationFrame(renderEffect);
        }
    }

    window.onload = initApp;
</script>

</body>
</html>
